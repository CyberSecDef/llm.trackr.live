; Supervisor program definition for the Laravel queue worker (M6 chunk 6).
;
; Drop into /etc/supervisor/conf.d/ on the prod box, then:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start llm-viz-queue:*
;
; Adjust `directory`, `user`, and `stdout_logfile` for the target host
; before installing. Two workers default — bump `numprocs` if queue
; lag becomes the bottleneck; the StreamRunJob workload is I/O-bound
; (vendor HTTP + DB), so threads stay cheap.
;
; `stopwaitsecs=605` is one second longer than the StreamRunJob's
; in-flight timeout (600s) — gives an in-progress run a chance to
; finish cleanly on SIGTERM before supervisor escalates.

[program:llm-viz-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/llm.trackr.live/artisan queue:work database --queue=default --tries=1 --timeout=600 --sleep=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/llm-viz-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=605
