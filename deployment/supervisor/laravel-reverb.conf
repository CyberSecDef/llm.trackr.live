; Supervisor program definition for the Reverb WebSocket server (M6 chunk 6).
;
; Drop into /etc/supervisor/conf.d/ on the prod box, then:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start llm-viz-reverb:*
;
; Reverb binds to 0.0.0.0:8080 by default. In production, front it
; with nginx terminating TLS and proxying ws/wss → 127.0.0.1:8080.
; See deployment/nginx-reverb.example (added in M13) for the
; recommended location block.
;
; Single process — Reverb's pub/sub layer is in-memory and doesn't
; support multi-process out of the box. For higher fanout, swap the
; broadcaster to Pusher or scale horizontally with Reverb's Redis
; backend (deferred to M13).

[program:llm-viz-reverb]
process_name=%(program_name)s
command=php /var/www/llm.trackr.live/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/llm-viz-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
